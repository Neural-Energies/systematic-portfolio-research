[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "systematic-futures-portfolio"
version = "0.1.0"
description = "Point-in-time futures signal generation and validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
futures-signals = "systematic_futures.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E501"]
