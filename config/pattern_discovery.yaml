# Declared finite hypothesis space. Edit this file to enlarge the exhaustive sweep.
universe: [ES, NQ, CL, GC, 6E, 6J, HG, NG, ZC, ZN, NKD]
bar_minutes: 15
cost_bps_one_way: 1.5
minimum_independent_occurrences: 80
minimum_discovery_sharpe: 0.50
confirmation_sharpe_tolerance: 0.50
maximum_pair_correlation: 0.70
allocation_methods: [inverse_volatility, minimum_variance]
families:
  mean_reversion_zscore:
    windows: [8, 16, 32, 64]
    thresholds: [1.0, 1.5, 2.0, 2.5]
  trend_momentum:
    windows: [4, 8, 16, 32, 64]
    thresholds: [0.0, 0.5, 1.0]
  breakout:
    windows: [8, 16, 32, 64]
  lead_lag:
    lags: [1, 2, 4, 8]
    thresholds: [0.0, 0.5, 1.0]
  cointegration:
    lookbacks: [252, 504]
    entry_zscores: [1.5, 2.0, 2.5]
