[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "systematic-portfolio-research"
version = "0.1.0"
description = "Reproducible multi-asset systematic portfolio research workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "arch>=7.2,<9",
  "certifi>=2025,<2027",
  "duckdb>=1.4,<2",
  "exchange-calendars>=4.11,<5",
  "ipykernel>=7,<8",
  "jupyter>=1.1,<2",
  "matplotlib>=3.10,<4",
  "numba>=0.63,<0.64",
  "numpy>=1.26,<2",
  "osqp>=1.0,<1.1",
  "pandas>=2.3,<4",
  "pandera[pandas]>=0.26,<0.30",
  "plotly>=6.5,<7",
  "polars>=1.38,<2",
  "pyarrow>=23,<24",
  "pydantic>=2.12,<3",
  "pyyaml>=6,<7",
  "pyportfolioopt>=1.5,<2",
  "quantstats>=0.0.77,<0.1",
  "scikit-learn>=1.8,<2",
  "scipy>=1.17,<2",
  "statsmodels>=0.14,<0.15",
  "vectorbt>=1,<2",
]

[project.scripts]
research-data = "systematic_research.data_catalog:main"
research-instruments = "systematic_research.instruments:main"
research-normalize = "systematic_research.normalization:main"
research-panel = "systematic_research.research_panel:main"
research-features = "systematic_research.features:main"
research-preprocess = "systematic_research.preprocessing:main"
research-labels = "systematic_research.labels:main"
research-regimes = "systematic_research.regimes:main"
research-trend = "systematic_research.trend:main"
research-mean-reversion = "systematic_research.mean_reversion:main"
research-intraday-mean-reversion = "systematic_research.intraday_mean_reversion:main"
research-ml-trend = "systematic_research.ml_trend:main"
research-regression-displacement = "systematic_research.regression_displacement:main"
research-rates-reversion = "systematic_research.rates_reversion:main"
research-candidate-portfolio = "systematic_research.candidate_portfolio:main"
research-broad-search = "systematic_research.broad_strategy_search:main"
research-saved-strategy = "systematic_research.saved_strategy_runner:main"
research-intraday-search = "systematic_research.intraday_strategy_search:main"
research-sealed-evaluation = "systematic_research.sealed_evaluator:main"
research-legacy-strategy-factory = "systematic_research.strategy_factory:main"
research-strategy-factory = "systematic_research.vectorbt_strategy_factory:main"
research-vectorbt-factory = "systematic_research.vectorbt_strategy_factory:main"
research-paper-factory = "systematic_research.paper_strategy_factory:main"
research-daily-session-factory = "systematic_research.daily_session_factory:main"
research-daily-session-sealed = "systematic_research.daily_session_sealed:main"
research-archive-daily-session-candidate = "systematic_research.archive_daily_session_candidate:main"
research-unique-hypothesis-factory = "systematic_research.unique_hypothesis_factory:main"
research-archive-unique-hypothesis-run = "systematic_research.archive_unique_hypothesis_run:main"
research-ml-hypothesis-factory = "systematic_research.ml_hypothesis_factory:main"
research-cot-hedging-pressure = "systematic_research.cot_hedging_pressure:main"
research-graph-laplacian-rv = "systematic_research.graph_laplacian_rv:main"
research-pca-residual-reversal = "systematic_research.pca_residual_reversal:main"
research-managed-money-diffusion = "systematic_research.managed_money_diffusion:main"
research-regularized-var-network = "systematic_research.regularized_var_network:main"
research-eia-release-drift = "systematic_research.eia_release_drift:main"
research-institutional-eda = "systematic_research.institutional_eda:main"
research-free-crypto = "systematic_research.free_market_data:main"

[dependency-groups]
dev = [
  "hypothesis>=6.151,<7",
  "mypy>=1.19,<2",
  "pandas-stubs>=2.3,<3",
  "pytest>=9,<10",
  "ruff>=0.15,<0.16",
  "scipy-stubs>=1.17,<2",
  "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/systematic_research"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["data", "outputs", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
